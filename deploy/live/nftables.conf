#!/usr/sbin/nft -f
# Host firewall for an OpenSBC box (applied by "make live-firewall").
# Docker keeps its own nat/filter tables for published ports; this table only
# filters what reaches the host itself (FreeSWITCH on the host network, ssh,
# the loopback-bound service ports).
# Idempotent: create the table if missing, empty it, then fill it (Docker's own tables are untouched).
table inet sbc {}
flush table inet sbc
table inet sbc {
  set carriers {
    type ipv4_addr
    flags interval
    comment "carrier signalling sources allowed to 5080; edit with: nft add element inet sbc carriers { 203.0.113.0/24 }"
  }

  chain input {
    type filter hook input priority 0; policy drop;

    iifname "lo" accept
    ct state established,related accept
    ct state invalid drop

    # docker bridges (dev and live stacks) may talk to the host freely (ESL on 172.29.0.1:8021, internal API)
    iifname { "docker0", "br-*" } accept

    ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } accept
    ip6 nexthdr icmpv6 accept

    tcp dport 22 accept comment "ssh"
    tcp dport { 8080, 8443 } accept comment "web ui and admin api (https)"

    udp dport 5060 accept comment "customer SIP"
    tcp dport 5060 accept comment "customer SIP"
    tcp dport 5061 accept comment "customer SIP TLS"
    ip saddr @carriers udp dport 5080 accept comment "carrier SIP"
    ip saddr @carriers tcp dport 5080 accept comment "carrier SIP"
    ip saddr @carriers tcp dport 5081 accept comment "carrier SIP TLS"
    udp dport 16384-32768 accept comment "RTP"

    # everything else (ESL 8021, internal API 8081, postgres, redis, metrics) is dropped
    counter drop
  }
}
