#!/usr/sbin/nft -f
# Host firewall for an SuperSBC box (applied by "make live-firewall").
# Docker keeps its own nat/filter tables for published ports; this table only
# filters what reaches the host itself (FreeSWITCH on the host network, ssh,
# the loopback-bound service ports).
# Idempotent: create the table if missing, empty it, then fill it (Docker's own tables are untouched).
table inet sbc {}
flush table inet sbc
table inet sbc {
  # The three sets below are filled by sbc-fwsync from the database (D-69):
  # customer addresses, carrier gateways and signalling sources, banned
  # addresses. Do not edit them by hand; change the customer or carrier in the UI.
  set customers {
    type ipv4_addr
    flags interval
    comment "customer source addresses allowed to 5060/5061 (from customer_ips, synced by sbc-fwsync)"
  }
  set carriers {
    type ipv4_addr
    flags interval
    comment "carrier signalling sources allowed to 5080/5081 (from carriers, synced by sbc-fwsync)"
  }

  # Addresses banned by the SBC (scanner protection, D-58) mirrored here by
  # sbc-fwsync so their packets never reach FreeSWITCH (D-66, D-69).
  set banned {
    type ipv4_addr
    flags timeout
    comment "SBC ban list (synced by sbc-fwsync)"
  }

  chain input {
    type filter hook input priority 0; policy drop;

    iifname "lo" accept
    ct state established,related accept
    ct state invalid drop

    ip saddr @banned counter drop comment "SBC ban list"

    # docker bridges (dev and live stacks) may talk to the host freely (ESL on 172.29.0.1:8021, internal API)
    iifname { "docker0", "br-*" } accept

    ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } accept
    ip6 nexthdr icmpv6 accept

    tcp dport 22 accept comment "ssh"
    tcp dport { 8080, 8443 } accept comment "web ui and admin api (https)"

    # Packet level flood protection (D-66): per source rate limits on SIP
    # signalling, generous for a real customer (a 100 CPS customer sends well
    # under 100 packets per second with retransmissions) and fatal for a scanner.
    udp dport 5060 meter sipflood4 { ip saddr limit rate over 200/second burst 400 packets } counter drop comment "SIP UDP flood"
    tcp dport { 5060, 5061 } ct state new meter sipsyn4 { ip saddr limit rate over 30/second burst 60 packets } counter drop comment "SIP TCP connection flood"
    ip saddr @customers udp dport 5060 accept comment "customer SIP"
    ip saddr @customers tcp dport 5060 accept comment "customer SIP"
    ip saddr @customers tcp dport 5061 accept comment "customer SIP TLS"
    ip saddr @carriers udp dport 5080 accept comment "carrier SIP"
    ip saddr @carriers tcp dport 5080 accept comment "carrier SIP"
    ip saddr @carriers tcp dport 5081 accept comment "carrier SIP TLS"
    udp dport 16384-32768 accept comment "RTP"

    # everything else (ESL 8021, internal API 8081, postgres, redis, metrics) is dropped
    counter drop
  }
}

# Set contents as of the last sync, so the sets are populated at boot before
# the containers start (written by sbc-fwsync; make live-firewall creates it empty).
include "/root/supersbc/deploy/live/state/firewall-sets.nft"
