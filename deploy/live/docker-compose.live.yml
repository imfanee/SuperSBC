# SuperSBC "mini-live" environment: a second, independent stack on the same
# host as the dev stack. FreeSWITCH runs on the host network (SIP 5060 for
# customers, 5080 for carriers, RTP 16384 to 32768 directly on the box);
# nginx serves the UI and API on 8080 (redirects to https) and 8443.
#
#   make live-init        # once: writes .env.live with random secrets, self-signed TLS
#   make live-up          # docker compose -p supersbc-live --env-file .env.live -f deploy/live/docker-compose.live.yml up -d --build
#
# Everything else (postgres, redis, api, web) stays on a private bridge
# 172.29.0.0/24 with only loopback-bound host ports.
name: supersbc-live

x-logging: &logging
  driver: json-file
  options: { max-size: "50m", max-file: "10" }

networks:
  live:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
          gateway: 172.29.0.1

volumes:
  pgdata:
  hepdata:
  fsconfig:
  fslogs:
  promdata:
  grafanadata:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: supersbc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: supersbc
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=120", "-c", "log_min_duration_statement=500ms"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${SBC_PG_PORT:-25432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supersbc -d supersbc"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [live]
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${SBC_REDIS_PORT:-26379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [live]
    logging: *logging

  api:
    build:
      context: ../..
      args:
        VERSION: ${SBC_VERSION:-live}
    image: supersbc/sbc-api:${SBC_VERSION:-live}
    env_file: ../../.env.live
    environment:
      SBC_FS_CONFIG_DIR: /fsconfig
      SBC_ESL_HOST: ${SBC_ESL_HOST:-172.29.0.1}
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - fsconfig:/fsconfig
      - fslogs:/var/log/freeswitch:ro
      - ./state:/state
    ports:
      # Internal call control API: FreeSWITCH on the host network reaches it via loopback.
      - "127.0.0.1:${SBC_INTERNAL_PORT:-8081}:8081"
      # Admin API for local tooling only; nginx proxies it on 8443.
      - "127.0.0.1:${SBC_ADMIN_PORT:-28080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [live]
    logging: *logging

  freeswitch:
    image: safarov/freeswitch:1.10.12
    env_file: ../../.env.live
    network_mode: host
    # Run FreeSWITCH directly: the image entrypoint also starts an Erlang epmd on 0.0.0.0:4369.
    entrypoint: ["/usr/bin/freeswitch", "-nf", "-nonat"]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - ../../freeswitch/conf:/etc/freeswitch:ro
      - ../../freeswitch/scripts:/usr/share/freeswitch/scripts:ro
      - ./tls:/etc/freeswitch/tls:ro
      - type: volume
        source: fsconfig
        target: /etc/freeswitch/sip_profiles/external-egress
        volume: { subpath: gateways }
      - type: volume
        source: fsconfig
        target: /etc/freeswitch/sip_profiles/external-ingress
        volume: { subpath: ingress }
      - type: volume
        source: fsconfig
        target: /etc/freeswitch/acl.d
        volume: { subpath: acl }
      - fslogs:/var/log/freeswitch
    healthcheck:
      test: ["CMD-SHELL", "fs_cli -H $$SBC_FS_ESL_LISTEN_IP -p \"$$SBC_ESL_PASSWORD\" -x status | grep -q 'is ready' && fs_cli -H $$SBC_FS_ESL_LISTEN_IP -p \"$$SBC_ESL_PASSWORD\" -x 'sofia status' | grep -q 'external-ingress.*RUNNING'"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  web:
    build:
      context: ../../web
      dockerfile: Dockerfile.live
    image: supersbc/web:${SBC_VERSION:-live}
    ports:
      - "${SBC_HTTP_PORT:-8080}:80"
      - "${SBC_HTTPS_PORT:-8443}:443"
    volumes:
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      - api
    restart: unless-stopped
    networks: [live]
    logging: *logging

  # ---- SIP capture (D-65, D-71): FreeSWITCH mirrors SIP as HEPv3 to heplify-server
  # (bound to the live bridge gateway), which stores it in hepdb; the CDR "SIP trace"
  # viewer reads hepdb. The HOMER web UI is optional (--profile homer).
  hepdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: homer
      POSTGRES_PASSWORD: ${HOMER_DB_PASSWORD:?set HOMER_DB_PASSWORD in .env.live}
    volumes:
      - hepdata:/var/lib/postgresql/data
      - ../homer/initdb.sql:/docker-entrypoint-initdb.d/001_databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homer"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [live]
    logging: *logging
  heplify:
    image: sipcapture/heplify-server:latest
    working_dir: /root
    command: ["./heplify-server"]
    environment:
      HEPLIFYSERVER_HEPADDR: 0.0.0.0:9060
      HEPLIFYSERVER_DBSHEMA: homer7
      HEPLIFYSERVER_DBDRIVER: postgres
      HEPLIFYSERVER_DBADDR: hepdb:5432
      HEPLIFYSERVER_DBUSER: homer
      HEPLIFYSERVER_DBPASS: ${HOMER_DB_PASSWORD}
      HEPLIFYSERVER_DBDATATABLE: homer_data
      HEPLIFYSERVER_DBCONFTABLE: homer_config
      HEPLIFYSERVER_DBROTATE: "true"
      HEPLIFYSERVER_DBDROPDAYS: ${HOMER_KEEP_DAYS:-30}
      HEPLIFYSERVER_LOGLVL: info
      HEPLIFYSERVER_LOGSTD: "true"
      HEPLIFYSERVER_DEDUP: "false"
    ports:
      - "172.29.0.1:9060:9060/udp"
    depends_on:
      hepdb: { condition: service_healthy }
    restart: unless-stopped
    networks: [live]
    logging: *logging
  homer-webapp:
    image: sipcapture/webapp:latest
    profiles: [homer]
    environment:
      DB_HOST: hepdb
      DB_USER: homer
      DB_PASS: ${HOMER_DB_PASSWORD}
      DB_DATA: homer_data
      DB_CONFIG: homer_config
      LOGLEVEL: info
    ports:
      - "127.0.0.1:${SBC_HOMER_PORT:-19081}:80"
    depends_on:
      hepdb: { condition: service_healthy }
    restart: unless-stopped
    networks: [live]
    logging: *logging

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:${SBC_PROMETHEUS_PORT:-29090}:9090"
    restart: unless-stopped
    networks: [live]
  grafana:
    image: grafana/grafana:11.3.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://%(domain)s:8443/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    restart: unless-stopped
    networks: [live]

  backup:
    image: postgres:16-alpine
    profiles: [backup]
    environment:
      PGHOST: postgres
      PGUSER: supersbc
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: supersbc
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ../backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ../../backups/live:/backups
    entrypoint: ["/bin/sh", "-c", "echo '30 2 * * * /usr/local/bin/backup.sh' > /etc/crontabs/root && crond -f -l 8"]
    restart: unless-stopped
    networks: [live]
