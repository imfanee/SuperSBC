name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - uses: golangci/golangci-lint-action@v8
        with: { version: v2.5 }
      - name: luacheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.3 liblua5.3-dev luarocks
          sudo luarocks install luacheck
          luacheck freeswitch/scripts
      - name: no em-dash (D-41)
        run: make lint-emdash

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - run: go test -race -count=1 ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: opensbc, POSTGRES_PASSWORD: opensbc, POSTGRES_DB: opensbc }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U opensbc" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - run: PGPASSWORD=opensbc psql -h 127.0.0.1 -U opensbc -d opensbc -c 'CREATE DATABASE opensbc_test OWNER opensbc'
      - run: go test -race -count=1 -tags integration ./internal/... -run Integration
        env:
          SBC_TEST_DATABASE_URL: postgres://opensbc:opensbc@127.0.0.1:5432/opensbc_test?sslmode=disable
          SBC_TEST_REDIS_URL: redis://127.0.0.1:6379/1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd web && npm ci && npm run lint && npm run typecheck && npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - run: cp .env.example .env
      - run: make e2e
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd web && npm ci && npx playwright install --with-deps chromium
      - run: make e2e-ui
      - if: always()
        run: docker compose --profile e2e logs --no-color > e2e-logs.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: e2e-logs, path: e2e-logs.txt }
