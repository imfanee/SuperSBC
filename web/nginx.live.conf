# Live: plain HTTP on 80 serves the ACME challenge and redirects everything
# else to HTTPS on 443. Both are published on their real ports, so the UI is
# https://sbc.softautonomi.com with a certificate the browser trusts (D-80).
server {
    listen 80;
    server_name _;
    location = /healthz { proxy_pass http://api:8080/healthz; }
    # Let's Encrypt writes its challenge here through a bind mount, so a
    # renewal never needs the web server stopped.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location = /readyz { proxy_pass http://api:8080/readyz; }
    location = /healthz { proxy_pass http://api:8080/healthz; }
    # Metrics and Grafana are reachable only after login-less local access; keep metrics off the public UI.
    location = /metrics { return 403; }
    # Grafana is an optional profile: resolve lazily so nginx starts without it.
    location /grafana/ {
        resolver 127.0.0.11 valid=10s;
        set $grafana grafana;
        rewrite ^/grafana/(.*)$ /$1 break;
        proxy_pass http://$grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
