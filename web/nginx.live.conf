# Rate limits (D-81). The UI is on a public name now, so scanners find it
# within hours. The zones are per source address: an operator clicking around
# never notices them, a credential stuffer and a crawler both stall.
#   auth   signing in, resetting a password, confirming a second factor
#   api    everything else under /api/v1
#   ui     the static application and its assets
limit_req_zone $binary_remote_addr zone=sbc_auth:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=sbc_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=sbc_ui:10m rate=60r/s;
limit_conn_zone $binary_remote_addr zone=sbc_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# Live: plain HTTP on 80 serves the ACME challenge and redirects everything
# else to HTTPS on 443. Both are published on their real ports, so the UI is
# https://sbc.softautonomi.com with a certificate the browser trusts (D-80).
server {
    listen 80;
    server_name _;
    location = /healthz { proxy_pass http://api:8080/healthz; }
    # Let's Encrypt writes its challenge here through a bind mount, so a
    # renewal never needs the web server stopped.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    limit_conn sbc_conn 40;

    # Probe paths no part of this application ever serves. Answering with 444
    # closes the connection without a response, which costs a scanner a round
    # trip and keeps the log readable.
    location ~* ^/(\.env|\.git|\.aws|\.ssh|wp-|wordpress|xmlrpc\.php|phpmyadmin|pma|admin\.php|administrator|cgi-bin|vendor/|autodiscover|owa/|boaform|solr/|actuator|telescope|debug/) {
        access_log off;
        return 444;
    }
    location ~* \.(php|asp|aspx|jsp|cgi|sh|sql|bak|old|swp)$ {
        access_log off;
        return 444;
    }

    root /usr/share/nginx/html;
    index index.html;
    limit_req zone=sbc_ui burst=120 nodelay;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # Signing in, resetting a password and confirming a second factor are the
    # three doors worth guessing at, so they get the strict zone. The burst
    # covers a mistyped password, nodelay keeps the honest attempt instant.
    location ~ ^/api/v1/auth/(login|password-reset|password-reset/confirm|totp) {
        limit_req zone=sbc_auth burst=8 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /api/ {
        limit_req zone=sbc_api burst=40 nodelay;
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location = /readyz { proxy_pass http://api:8080/readyz; }
    location = /healthz { proxy_pass http://api:8080/healthz; }
    # Metrics and Grafana are reachable only after login-less local access; keep metrics off the public UI.
    location = /metrics { return 403; }
    # Grafana is an optional profile: resolve lazily so nginx starts without it.
    location /grafana/ {
        resolver 127.0.0.11 valid=10s;
        set $grafana grafana;
        rewrite ^/grafana/(.*)$ /$1 break;
        proxy_pass http://$grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
