name: supersbc

x-logging: &logging
  driver: json-file
  options: { max-size: "50m", max-file: "5" }

networks:
  sbc:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  fsconfig:
  fslogs:
  promdata:
  grafanadata:
  homerdata:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: supersbc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersbc}
      POSTGRES_DB: supersbc
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${SBC_PG_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supersbc -d supersbc"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      sbc:
        ipv4_address: 172.28.0.30
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${SBC_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      sbc:
        ipv4_address: 172.28.0.40
    logging: *logging

  api:
    build:
      context: .
      args:
        VERSION: ${SBC_VERSION:-dev}
    image: supersbc/sbc-api:${SBC_VERSION:-dev}
    env_file: .env
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    environment:
      SBC_FS_CONFIG_DIR: /fsconfig
      # Shell environment overrides .env for these (used by the e2e suite to
      # exercise the max call duration cap and strict ACL mode).
      SBC_BILLING_MAX_CALL_DURATION: ${SBC_BILLING_MAX_CALL_DURATION:-4h}
      SBC_ACL_MODE: ${SBC_ACL_MODE:-dialplan}
    volumes:
      - fsconfig:/fsconfig
      - fslogs:/var/log/freeswitch:ro
    ports:
      - "127.0.0.1:${SBC_ADMIN_PORT:-18080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      sbc:
        ipv4_address: 172.28.0.20
    logging: *logging

  freeswitch:
    image: safarov/freeswitch:1.10.12
    env_file: .env
    # Run FreeSWITCH directly: the image entrypoint also starts an Erlang epmd on 0.0.0.0:4369.
    entrypoint: ["/usr/bin/freeswitch", "-nf", "-nonat"]
    # Every call uses four sockets (RTP and RTCP on both legs) plus SIP and
    # ESL; the default 1024 descriptors exhaust at about 150 concurrent calls.
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - ./freeswitch/conf:/etc/freeswitch:ro
      - ./freeswitch/scripts:/usr/share/freeswitch/scripts:ro
      - ./freeswitch/tls:/etc/freeswitch/tls:ro
      - type: volume
        source: fsconfig
        target: /etc/freeswitch/sip_profiles/external-egress
        volume: { subpath: gateways }
      - type: volume
        source: fsconfig
        target: /etc/freeswitch/sip_profiles/external-ingress
        volume: { subpath: ingress }
      - type: volume
        source: fsconfig
        target: /etc/freeswitch/acl.d
        volume: { subpath: acl }
      - fslogs:/var/log/freeswitch
    # RTP and SIP are reachable inside the compose network without publishing.
    # For real customers use deploy/docker-compose.host.yml (network_mode: host).
    healthcheck:
      test: ["CMD-SHELL", "fs_cli -H 127.0.0.1 -p \"$$SBC_ESL_PASSWORD\" -x status | grep -q 'is ready' && fs_cli -H 127.0.0.1 -p \"$$SBC_ESL_PASSWORD\" -x 'sofia status' | grep -q 'external-ingress.*RUNNING'"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      api: { condition: service_healthy }
    networks:
      sbc:
        ipv4_address: 172.28.0.10
    logging: *logging

  web:
    build:
      context: ./web
    image: supersbc/web:${SBC_VERSION:-dev}
    ports:
      - "127.0.0.1:${SBC_WEB_PORT:-13000}:80"
    depends_on:
      - api
    networks:
      sbc:
        ipv4_address: 172.28.0.50
    logging: *logging

  # ---- e2e: mock carriers (sipp UAS) and mock customers (sipp UAC) ----
  # Started with: docker compose --profile e2e up -d
  carrier-answer:
    build: ./tests/e2e/sipp
    image: supersbc/sipp:3.7
    profiles: [e2e]
    command: ["-sf", "/scenarios/uas_answer.xml", "-i", "172.28.0.61", "-p", "5060", "-mi", "172.28.0.61", "-mp", "6000", "-nostdin", "-trace_err", "-error_file", "/dev/null", "-trace_msg", "-message_file", "/out/carrier-answer.msg"]
    volumes: ["./tests/e2e/scenarios:/scenarios:ro", "./tests/e2e/out:/out"]
    networks:
      sbc: { ipv4_address: 172.28.0.61 }
    restart: unless-stopped
  carrier-503:
    image: supersbc/sipp:3.7
    profiles: [e2e]
    command: ["-sf", "/scenarios/uas_503.xml", "-i", "172.28.0.62", "-p", "5060", "-nostdin", "-trace_err", "-error_file", "/dev/null"]
    volumes: ["./tests/e2e/scenarios:/scenarios:ro"]
    networks:
      sbc: { ipv4_address: 172.28.0.62 }
    restart: unless-stopped
  carrier-404:
    image: supersbc/sipp:3.7
    profiles: [e2e]
    command: ["-sf", "/scenarios/uas_404.xml", "-i", "172.28.0.63", "-p", "5060", "-nostdin", "-trace_err", "-error_file", "/dev/null"]
    volumes: ["./tests/e2e/scenarios:/scenarios:ro"]
    networks:
      sbc: { ipv4_address: 172.28.0.63 }
    restart: unless-stopped

  # Mock customers are one-shot: docker compose --profile e2e-clients run --rm customer-acme <sipp args>
  customer-acme:
    image: supersbc/sipp:3.7
    profiles: [e2e-clients]
    working_dir: /out
    volumes: ["./tests/e2e/scenarios:/scenarios:ro", "./tests/e2e/out:/out"]
    networks:
      sbc: { ipv4_address: 172.28.0.101 }
  customer-beta:
    image: supersbc/sipp:3.7
    profiles: [e2e-clients]
    working_dir: /out
    volumes: ["./tests/e2e/scenarios:/scenarios:ro", "./tests/e2e/out:/out"]
    networks:
      sbc: { ipv4_address: 172.28.0.102 }
  customer-gamma:
    image: supersbc/sipp:3.7
    profiles: [e2e-clients]
    working_dir: /out
    volumes: ["./tests/e2e/scenarios:/scenarios:ro", "./tests/e2e/out:/out"]
    networks:
      sbc: { ipv4_address: 172.28.0.103 }
  customer-delta:
    image: supersbc/sipp:3.7
    profiles: [e2e-clients]
    working_dir: /out
    volumes: ["./tests/e2e/scenarios:/scenarios:ro", "./tests/e2e/out:/out"]
    networks:
      sbc: { ipv4_address: 172.28.0.104 }
  customer-epsilon:
    image: supersbc/sipp:3.7
    profiles: [e2e-clients]
    working_dir: /out
    volumes: ["./tests/e2e/scenarios:/scenarios:ro", "./tests/e2e/out:/out"]
    networks:
      sbc: { ipv4_address: 172.28.0.105 }
  customer-euro:
    image: supersbc/sipp:3.7
    profiles: [e2e-clients]
    working_dir: /out
    volumes: ["./tests/e2e/scenarios:/scenarios:ro", "./tests/e2e/out:/out"]
    networks:
      sbc: { ipv4_address: 172.28.0.106 }
  customer-loadtest:
    image: supersbc/sipp:3.7
    profiles: [e2e-clients]
    working_dir: /out
    volumes: ["./tests/e2e/scenarios:/scenarios:ro", "./tests/e2e/out:/out"]
    networks:
      sbc: { ipv4_address: 172.28.0.110 }
  customer-zeta:
    image: supersbc/sipp:3.7
    profiles: [e2e-clients]
    working_dir: /out
    volumes: ["./tests/e2e/scenarios:/scenarios:ro", "./tests/e2e/out:/out"]
    networks:
      sbc: { ipv4_address: 172.28.0.107 }
  customer-eta:
    image: supersbc/sipp:3.7
    profiles: [e2e-clients]
    working_dir: /out
    volumes: ["./tests/e2e/scenarios:/scenarios:ro", "./tests/e2e/out:/out"]
    networks:
      sbc: { ipv4_address: 172.28.0.108 }
  customer-theta:
    image: supersbc/sipp:3.7
    profiles: [e2e-clients]
    working_dir: /out
    volumes: ["./tests/e2e/scenarios:/scenarios:ro", "./tests/e2e/out:/out"]
    networks:
      sbc: { ipv4_address: 172.28.0.109 }
  customer-iota:
    image: supersbc/sipp:3.7
    profiles: [e2e-clients]
    working_dir: /out
    volumes: ["./tests/e2e/scenarios:/scenarios:ro", "./tests/e2e/out:/out"]
    networks:
      sbc: { ipv4_address: 172.28.0.111 }
  customer-unknown:
    image: supersbc/sipp:3.7
    profiles: [e2e-clients]
    working_dir: /out
    volumes: ["./tests/e2e/scenarios:/scenarios:ro", "./tests/e2e/out:/out"]
    networks:
      sbc: { ipv4_address: 172.28.0.199 }

  # ---- monitoring (docker compose --profile monitoring up -d) ----
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:${SBC_PROMETHEUS_PORT:-19090}:9090"
    networks: [sbc]
  grafana:
    image: grafana/grafana:11.3.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:${SBC_GRAFANA_PORT:-13001}:3000"
    networks: [sbc]

  # ---- HOMER SIP capture (docker compose --profile homer up -d; D-65) ----
  # FreeSWITCH mirrors SIP as HEPv3 to SBC_FS_HEP_SERVER; heplify-server listens
  # on the docker bridge address so the host network live stack can reach it too.
  homer-db:
    image: postgres:16-alpine
    profiles: [homer]
    environment:
      POSTGRES_USER: homer
      POSTGRES_PASSWORD: ${HOMER_DB_PASSWORD:-homer}
    volumes:
      - homerdata:/var/lib/postgresql/data
      - ./deploy/homer/initdb.sql:/docker-entrypoint-initdb.d/001_databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homer"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [sbc]
  heplify-server:
    image: sipcapture/heplify-server:latest
    profiles: [homer]
    working_dir: /root
    command: ["./heplify-server"]
    environment:
      HEPLIFYSERVER_HEPADDR: 0.0.0.0:9060
      HEPLIFYSERVER_DBSHEMA: homer7
      HEPLIFYSERVER_DBDRIVER: postgres
      HEPLIFYSERVER_DBADDR: homer-db:5432
      HEPLIFYSERVER_DBUSER: homer
      HEPLIFYSERVER_DBPASS: ${HOMER_DB_PASSWORD:-homer}
      HEPLIFYSERVER_DBDATATABLE: homer_data
      HEPLIFYSERVER_DBCONFTABLE: homer_config
      HEPLIFYSERVER_DBROTATE: "true"
      HEPLIFYSERVER_DBDROPDAYS: ${HOMER_KEEP_DAYS:-7}
      HEPLIFYSERVER_LOGLVL: info
      HEPLIFYSERVER_LOGSTD: "true"
      HEPLIFYSERVER_DEDUP: "false"
    # Bound to the dev docker bridge gateway only; the live stack runs its own heplify (D-71).
    ports:
      - "${SBC_HEP_BIND:-172.28.0.1}:9060:9060/udp"
    depends_on:
      homer-db: { condition: service_healthy }
    restart: unless-stopped
    networks: [sbc]
  homer-webapp:
    image: sipcapture/webapp:latest
    profiles: [homer]
    environment:
      DB_HOST: homer-db
      DB_USER: homer
      DB_PASS: ${HOMER_DB_PASSWORD:-homer}
      DB_DATA: homer_data
      DB_CONFIG: homer_config
      LOGLEVEL: info
    ports:
      - "127.0.0.1:${SBC_HOMER_PORT:-19080}:80"
    depends_on:
      homer-db: { condition: service_healthy }
    restart: unless-stopped
    networks: [sbc]

  # ---- backups (docker compose --profile backup up -d): pg_dump every night at 02:30 UTC ----
  backup:
    image: postgres:16-alpine
    profiles: [backup]
    environment:
      PGHOST: postgres
      PGUSER: supersbc
      PGPASSWORD: ${POSTGRES_PASSWORD:-supersbc}
      PGDATABASE: supersbc
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c", "echo '30 2 * * * /usr/local/bin/backup.sh' > /etc/crontabs/root && crond -f -l 8"]
    networks: [sbc]
