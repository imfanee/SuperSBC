name: opensbc

x-logging: &logging
  driver: json-file
  options: { max-size: "50m", max-file: "5" }

networks:
  sbc:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  fsconfig:
  fslogs:
  promdata:
  grafanadata:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opensbc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opensbc}
      POSTGRES_DB: opensbc
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${SBC_PG_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensbc -d opensbc"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      sbc:
        ipv4_address: 172.28.0.30
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${SBC_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      sbc:
        ipv4_address: 172.28.0.40
    logging: *logging

  api:
    build:
      context: .
      args:
        VERSION: ${SBC_VERSION:-dev}
    image: opensbc/sbc-api:${SBC_VERSION:-dev}
    env_file: .env
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    environment:
      SBC_FS_CONFIG_DIR: /fsconfig
      # Shell environment overrides .env for these (used by the e2e suite to
      # exercise the max call duration cap and strict ACL mode).
      SBC_BILLING_MAX_CALL_DURATION: ${SBC_BILLING_MAX_CALL_DURATION:-4h}
      SBC_ACL_MODE: ${SBC_ACL_MODE:-dialplan}
    volumes:
      - fsconfig:/fsconfig
      - fslogs:/var/log/freeswitch:ro
    ports:
      - "127.0.0.1:${SBC_ADMIN_PORT:-18080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      sbc:
        ipv4_address: 172.28.0.20
    logging: *logging

  freeswitch:
    image: safarov/freeswitch:1.10.12
    env_file: .env
    # Run FreeSWITCH directly: the image entrypoint also starts an Erlang epmd on 0.0.0.0:4369.
    entrypoint: ["/usr/bin/freeswitch", "-nf", "-nonat"]
    # Every call uses four sockets (RTP and RTCP on both legs) plus SIP and
    # ESL; the default 1024 descriptors exhaust at about 150 concurrent calls.
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - ./freeswitch/conf:/etc/freeswitch:ro
      - ./freeswitch/scripts:/usr/share/freeswitch/scripts:ro
      - type: volume
        source: fsconfig
        target: /etc/freeswitch/sip_profiles/external-egress
        volume: { subpath: gateways }
      - type: volume
        source: fsconfig
        target: /etc/freeswitch/acl.d
        volume: { subpath: acl }
      - fslogs:/var/log/freeswitch
    # RTP and SIP are reachable inside the compose network without publishing.
    # For real customers use deploy/docker-compose.host.yml (network_mode: host).
    healthcheck:
      test: ["CMD-SHELL", "fs_cli -H 127.0.0.1 -p \"$$SBC_ESL_PASSWORD\" -x status | grep -q 'is ready' && fs_cli -H 127.0.0.1 -p \"$$SBC_ESL_PASSWORD\" -x 'sofia status' | grep -q 'external-ingress.*RUNNING'"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      api: { condition: service_healthy }
    networks:
      sbc:
        ipv4_address: 172.28.0.10
    logging: *logging

  web:
    build:
      context: ./web
    image: opensbc/web:${SBC_VERSION:-dev}
    ports:
      - "127.0.0.1:${SBC_WEB_PORT:-13000}:80"
    depends_on:
      - api
    networks:
      sbc:
        ipv4_address: 172.28.0.50
    logging: *logging

  # ---- e2e: mock carriers (sipp UAS) and mock customers (sipp UAC) ----
  # Started with: docker compose --profile e2e up -d
  carrier-answer:
    image: ctaloi/sipp
    profiles: [e2e]
    command: ["-sf", "/scenarios/uas_answer.xml", "-i", "172.28.0.61", "-p", "5060", "-mi", "172.28.0.61", "-mp", "6000", "-nostdin", "-trace_err", "-error_file", "/dev/null", "-trace_msg", "-message_file", "/out/carrier-answer.msg"]
    volumes: ["./tests/e2e/scenarios:/scenarios:ro", "./tests/e2e/out:/out"]
    networks:
      sbc: { ipv4_address: 172.28.0.61 }
    restart: unless-stopped
  carrier-503:
    image: ctaloi/sipp
    profiles: [e2e]
    command: ["-sf", "/scenarios/uas_503.xml", "-i", "172.28.0.62", "-p", "5060", "-nostdin", "-trace_err", "-error_file", "/dev/null"]
    volumes: ["./tests/e2e/scenarios:/scenarios:ro"]
    networks:
      sbc: { ipv4_address: 172.28.0.62 }
    restart: unless-stopped
  carrier-404:
    image: ctaloi/sipp
    profiles: [e2e]
    command: ["-sf", "/scenarios/uas_404.xml", "-i", "172.28.0.63", "-p", "5060", "-nostdin", "-trace_err", "-error_file", "/dev/null"]
    volumes: ["./tests/e2e/scenarios:/scenarios:ro"]
    networks:
      sbc: { ipv4_address: 172.28.0.63 }
    restart: unless-stopped

  # Mock customers are one-shot: docker compose --profile e2e-clients run --rm customer-acme <sipp args>
  customer-acme:
    image: ctaloi/sipp
    profiles: [e2e-clients]
    working_dir: /out
    volumes: ["./tests/e2e/scenarios:/scenarios:ro", "./tests/e2e/out:/out"]
    networks:
      sbc: { ipv4_address: 172.28.0.101 }
  customer-beta:
    image: ctaloi/sipp
    profiles: [e2e-clients]
    working_dir: /out
    volumes: ["./tests/e2e/scenarios:/scenarios:ro", "./tests/e2e/out:/out"]
    networks:
      sbc: { ipv4_address: 172.28.0.102 }
  customer-gamma:
    image: ctaloi/sipp
    profiles: [e2e-clients]
    working_dir: /out
    volumes: ["./tests/e2e/scenarios:/scenarios:ro", "./tests/e2e/out:/out"]
    networks:
      sbc: { ipv4_address: 172.28.0.103 }
  customer-delta:
    image: ctaloi/sipp
    profiles: [e2e-clients]
    working_dir: /out
    volumes: ["./tests/e2e/scenarios:/scenarios:ro", "./tests/e2e/out:/out"]
    networks:
      sbc: { ipv4_address: 172.28.0.104 }
  customer-epsilon:
    image: ctaloi/sipp
    profiles: [e2e-clients]
    working_dir: /out
    volumes: ["./tests/e2e/scenarios:/scenarios:ro", "./tests/e2e/out:/out"]
    networks:
      sbc: { ipv4_address: 172.28.0.105 }
  customer-euro:
    image: ctaloi/sipp
    profiles: [e2e-clients]
    working_dir: /out
    volumes: ["./tests/e2e/scenarios:/scenarios:ro", "./tests/e2e/out:/out"]
    networks:
      sbc: { ipv4_address: 172.28.0.106 }
  customer-loadtest:
    image: ctaloi/sipp
    profiles: [e2e-clients]
    working_dir: /out
    volumes: ["./tests/e2e/scenarios:/scenarios:ro", "./tests/e2e/out:/out"]
    networks:
      sbc: { ipv4_address: 172.28.0.110 }
  customer-unknown:
    image: ctaloi/sipp
    profiles: [e2e-clients]
    working_dir: /out
    volumes: ["./tests/e2e/scenarios:/scenarios:ro", "./tests/e2e/out:/out"]
    networks:
      sbc: { ipv4_address: 172.28.0.199 }

  # ---- monitoring (docker compose --profile monitoring up -d) ----
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:${SBC_PROMETHEUS_PORT:-19090}:9090"
    networks: [sbc]
  grafana:
    image: grafana/grafana:11.3.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:${SBC_GRAFANA_PORT:-13001}:3000"
    networks: [sbc]

  # ---- backups (docker compose --profile backup up -d): pg_dump every night at 02:30 UTC ----
  backup:
    image: postgres:16-alpine
    profiles: [backup]
    environment:
      PGHOST: postgres
      PGUSER: opensbc
      PGPASSWORD: ${POSTGRES_PASSWORD:-opensbc}
      PGDATABASE: opensbc
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c", "echo '30 2 * * * /usr/local/bin/backup.sh' > /etc/crontabs/root && crond -f -l 8"]
    networks: [sbc]
